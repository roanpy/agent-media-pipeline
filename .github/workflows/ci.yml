name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
          python -m pip install ruff yt-dlp
      - name: Validate
        run: |
          python -m py_compile media-downloader.py tests/test_pipeline.py
          bash -n run.sh
          python -m json.tool config.example.json >/dev/null
          ruff check media-downloader.py tests/test_pipeline.py
          ./scripts/smoke-test.sh
          python tests/test_pipeline.py
